name: mirador
# Python 3.12 environment. These are the versions miRador was validated with:
# the bundled Arabidopsis test (test/) gives the same results as the earlier
# Python 3.7 environment. Create it with:
#   conda env create -n mirador -f environment.yml
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.12
  - biopython=1.88
  - blast=2.17.0
  - bowtie=1.3.1
  - emboss=6.6.0
  - ghostscript=10.08.0
  - numpy=2.5.4
  - perl=5.32.1
  - perl-io-string=1.08
  - pypdf=6.21.4
  - samtools=1.25
  - viennarna=2.7.2
